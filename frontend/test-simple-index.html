<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple Index</title>
</head>
<body>
    <h1>Test Simple Index</h1>
    
    <div id="categories-grid">
        <p>Categorías se cargarán aquí...</p>
    </div>
    
    <div id="featured-products">
        <p>Productos se cargarán aquí...</p>
    </div>
    
    <!-- Scripts -->
    <script src="js/api-service.js"></script>
    <script src="js/data-manager-optimized.js"></script>
    
    <script>
        console.log('🔧 Script cargado');
        
        // Test 1: Verificar si el DOM está listo
        console.log('📄 DOM ready state:', document.readyState);
        
        // Test 2: Verificar servicios
        console.log('🔍 apiService:', typeof apiService);
        console.log('🔍 dataManagerOptimized:', typeof dataManagerOptimized);
        
        // Test 3: Verificar elementos del DOM
        console.log('🔍 categories-grid:', document.getElementById('categories-grid'));
        console.log('🔍 featured-products:', document.getElementById('featured-products'));
        
        // Test 4: Event listener simple
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 DOMContentLoaded disparado');
            
            // Test manual de la función
            if (typeof apiService !== 'undefined') {
                console.log('✅ apiService disponible, probando getTopSellingProducts...');
                
                apiService.getTopSellingProducts(4)
                    .then(products => {
                        console.log('✅ Productos obtenidos:', products);
                        document.getElementById('featured-products').innerHTML = 
                            `<p>✅ Productos cargados: ${products.length}</p>`;
                    })
                    .catch(error => {
                        console.error('❌ Error:', error);
                        document.getElementById('featured-products').innerHTML = 
                            `<p>❌ Error: ${error.message}</p>`;
                    });
            } else {
                console.log('❌ apiService no disponible');
            }
        });
        
        // Test 5: Event listener alternativo
        if (document.readyState === 'loading') {
            console.log('📄 DOM aún cargando, esperando...');
        } else {
            console.log('📄 DOM ya está listo');
        }
    </script>
</body>
</html>
